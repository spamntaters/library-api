schema:
  - gql/schema.graphql

exec:
  filename: internal/graphql/generated.go
  package: graphql

model:
  filename: internal/graphql/models.go
  package: graphql

resolver:
  layout: follow-schema
  dir: internal/graphql
  package: graphql
  filename_template: "{name}.resolvers.go"

autobind: []

models:
  ID:
    model: github.com/99designs/gqlgen/graphql.IntID
